# 術語來源清單
# 下載後的原始檔放在 glossary/raw/（不上傳 GitHub，由下載程式重新取得）
#
# 國家教育研究院「學術名詞」英中對照 CSV
# 授權：政府資料開放授權條款-第1版，可自由使用，需註明出處
# 資料集說明：https://data.gov.tw （搜尋「國家教育研究院 學術名詞」）
#
# tier：core = 你的主要領域；support = 相關領域；optional = 碰到才用

[naer]
provider = "國家教育研究院"
license = "政府資料開放授權條款-第1版"
base_url = "https://opendata.naer.edu.tw/學術名詞/"

[[source]]
id = "航空太空"
file = "國家教育研究院-航空太空學術名詞.csv"
tier = "core"

[[source]]
id = "力學"
file = "國家教育研究院-力學學術名詞.csv"
